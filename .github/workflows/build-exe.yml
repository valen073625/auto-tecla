name: Build AutoTecla.exe

on:
  push:
    branches: [main]
    paths:
      - "main.go"
      - "go.mod"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build AutoTecla.exe
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -ldflags="-s -w -H windowsgui" -o dist/AutoTecla.exe .

      - name: Upload AutoTecla.exe
        uses: actions/upload-artifact@v4
        with:
          name: AutoTecla-windows
          path: dist/AutoTecla.exe
          if-no-files-found: error
          retention-days: 14
