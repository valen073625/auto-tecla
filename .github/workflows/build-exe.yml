name: Build AutoTecla.exe

on:
  push:
    branches: [main]
    paths:
      - "auto_tecla.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build AutoTecla.exe
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --console --name AutoTecla --collect-all pynput --hidden-import pynput.keyboard._win32 auto_tecla.py

      - name: Upload AutoTecla.exe
        uses: actions/upload-artifact@v4
        with:
          name: AutoTecla-windows
          path: dist/AutoTecla.exe
          if-no-files-found: error
          retention-days: 14
